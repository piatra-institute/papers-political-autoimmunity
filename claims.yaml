- id: mutz-status
  kind: source
  passage: 'Status, as distinct from money, recurs in the work on recent realignments: perceived threat
    to a group''s relative position moved votes in 2016 on Mutz''s contested but careful account [@mutz2018],
    and ethnographies of resentment describe its texture directly [@cramer2016; @hochschild2016].'
  evidence:
    citation_id: mutz2018
    locator: Significance statement
    verified: true
    verification_note: 'DOI 10.1073/pnas.1718155115; Crossref abstract: in a 2012-2016 panel, change in
      financial wellbeing had little impact on candidate preference, while changing preferences tracked
      issues threatening white Americans'' sense of dominant group status.'
- id: jost-system-justification
  kind: source
  passage: System-justification theory documents that members of disadvantaged groups sometimes defend
    the arrangements that disadvantage them, which supplies a motive for supporting a dominant coalition
    from within a group it subordinates [@jost1994; @jost2004].
  evidence:
    citation_id: jost2004
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1111/j.1467-9221.2004.00402.x; Crossref abstract: a motive to justify the
      existing order is partly responsible for internalized inferiority among disadvantaged groups and
      is sometimes strongest among those most harmed by the status quo.'
- id: jost1994-false-consciousness
  kind: source
  passage: System-justification theory documents that members of disadvantaged groups sometimes defend
    the arrangements that disadvantage them, which supplies a motive for supporting a dominant coalition
    from within a group it subordinates [@jost1994; @jost2004].
  evidence:
    citation_id: jost1994
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1111/j.2044-8309.1994.tb01008.x; Crossref abstract: system-justification
      preserves existing arrangements even at the expense of personal and group interest, including participation
      by disadvantaged groups in negative stereotypes of themselves.'
- id: graham-foundations
  kind: source
  passage: Moral intuitions are weighted differently across the political spectrum, with loyalty, authority,
    and sanctity weighing on the right in ways an interest model built only from care and fairness cannot
    register [@graham2009]; a disposition toward order and conformity, activated by perceived threat,
    organizes a coherent politics [@stenner2005]; and ethnocentrism and racial resentment shape policy
    preferences through channels whose measurement remains contested [@kinder2009; @kinder1996].
  evidence:
    citation_id: graham2009
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1037/a0015141; Crossref abstract: liberals rely mainly on harm/care and
      fairness while conservatives use all five foundations, including ingroup/loyalty, authority and
      purity/sanctity, more equally.'
- id: kuklinski-misinformation
  kind: source
  passage: Voters who receive the signal reason with it through cues and shortcuts [@lupia1998], and received
    beliefs can be confident and wrong, a failure distinct from the absence of information [@kuklinski2000].
  evidence:
    citation_id: kuklinski2000
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1111/0022-3816.00033; Crossref abstract: people are misinformed when they
      confidently hold wrong beliefs, a problem distinct from lack of knowledge.'
- id: tversky-framing
  kind: source
  passage: Framing research shows that salience and awareness depend on how a choice is presented and
    are not fixed properties of the voter [@tversky1981], so the gates measure the information environment
    as well as the voter.
  evidence:
    citation_id: tversky1981
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1126/science.7455683; Crossref abstract: framing the same problem differently
      produces predictable shifts and reversals of preference.'
- id: iyengar-affect
  kind: source
  passage: As partisanship has aligned with race, religion, and place, these identities reinforce one
    another, and affect toward the out-party has become a motive in its own right [@mason2018; @iyengar2012;
    @iyengar2019].
  evidence:
    citation_id: iyengar2012
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1093/poq/nfs038; Crossref abstract: Republicans and Democrats increasingly
      dislike their opponents, and partisan affect is inconsistently founded in policy attitudes.'
- id: autoimmunity-definition
  kind: definition
  passage: 'We call the measured pattern political autoimmunity: support from a group for a coalition
    whose likely policies weaken the legal, administrative, redistributive, and status protections on
    which the group disproportionately depends.'
  rationale: Defines the construct as a structural relation with no verdict about voters.
- id: risk-product
  kind: definition
  passage: 'The adverse policy risk a candidate poses to a group in a domain is the product of five quantities,
    each scaled to the unit interval:'
  rationale: Defines adverse policy risk; the product form is a modelling choice explained in the same
    section.
- id: net-alignment
  kind: definition
  passage: Net alignment under interest model $m$ is weighted protection minus weighted risk,
  rationale: Defines net alignment.
- id: synthetic-inputs
  kind: assumption
  passage: All results are computed from a synthetic dataset whose exposure, dependence, hostility, implementation,
    magnitude, salience, and awareness values are stipulated to display the model's behaviour and are
    not estimates.
  rationale: All inputs except vote shares are stipulated to display the model's behaviour; results are
    properties of the specification.
- id: interest-parameter
  kind: assumption
  passage: Interest is treated as a parameter, and the literatures above supply seven defensible settings,
    each of which reclassifies some apparent self-harm as religious commitment, expressive identity, status,
    protest, or a tradeoff the voter would make again.
  rationale: The model fixes no interest function and reports results across seven.
- id: folk-inference
  kind: interpretation
  passage: The folk accusation observes part of $G_m$, the alarming domain, and concludes that $\mathrm{NA}_m
    < 0$; the inference is valid only when $\Pi_m$ is small, that is, only when the candidate offers the
    group nothing it wanted.
  rationale: Follows algebraically from NA = Pi - G.
- id: counting-frame
  kind: interpretation
  passage: Both numbers are correct and answer different questions.
  rationale: Interpretation of the reversal between per-supporter and population-weighted orderings (results.json
    /ranking/counting_frame_inverts).
- id: sign-depends
  kind: interpretation
  passage: The same vote and the same data yield opposite verdicts, and the only change is the analyst's
    definition of interest.
  rationale: Interpretation of the Latino sign change across interest readings (results.json /ranking/net_sign_by_group/latino/flips_sign).
- id: E-plus-K
  kind: interpretation
  passage: Exposure and awareness together account for $0.574$, and exposure and salience for $0.827$.
  rationale: The 0.574 figure is the sum of two bound shares, 0.467 (E) and 0.107 (K), from /variance_attribution/lgbtq/shares.
- id: ecological
  kind: interpretation
  passage: A population-weighted number is an ecological summary, and reading it as a per-voter verdict
    commits the ecological fallacy.
  rationale: Scope limit on per-voter readings.
- id: withholding
  kind: normative
  passage: A carefully constructed measure of political autoimmunity more often supports withholding the
    accusation than making it.
  rationale: Normative conclusion drawn from the robustness results.
